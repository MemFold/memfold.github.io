<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1331" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">Personalization case from paper Figure 6</title><desc id="desc">Original response text, reflowed for the MemFold website. Three methods answer the same fitness question.</desc><text x="8" y="18" font-size="12" fill="#666b70" font-weight="bold">User preference:</text><text x="8" y="46" font-size="16" fill="#242728" font-weight="normal">“I dislike using wearable technology and</text><text x="8" y="71" font-size="16" fill="#242728" font-weight="normal">fitness trackers.”</text><text x="8" y="112" font-size="12" fill="#666b70" font-weight="bold">Query:</text><text x="8" y="140" font-size="16" fill="#242728" font-weight="normal">“Can you recommend some effective ways</text><text x="8" y="165" font-size="16" fill="#242728" font-weight="normal">for me to monitor my fitness progress?”</text><text x="8" y="226" font-size="22" fill="#242728" font-weight="bold">(a) GRPO</text><text x="8" y="264" font-size="16" fill="#242728" font-weight="normal">… Keep a record of your weight, body</text><text x="8" y="289" font-size="16" fill="#242728" font-weight="normal">measurements, heart rate, and workout</text><text x="8" y="314" font-size="16" fill="#242728" font-weight="normal">performance.</text><text x="8" y="355" font-size="16" fill="#242728" font-weight="normal">Use a Fitness Tracker: Wearables like Fitbit</text><text x="8" y="380" font-size="16" fill="#242728" font-weight="normal">or Apple Watch can monitor steps, calories</text><text x="8" y="405" font-size="16" fill="#242728" font-weight="normal">burned, and sleep quality, providing real-time</text><text x="8" y="430" font-size="16" fill="#242728" font-weight="normal">feedback.</text><text x="8" y="471" font-size="16" fill="#666b70" font-weight="normal">… response continues until the generation</text><text x="8" y="496" font-size="16" fill="#242728" font-weight="normal">limit.</text><text x="8" y="541" font-size="13" fill="#666b70" font-weight="bold">Incorrect: violates preference</text><text x="8" y="564" font-size="12" fill="#666b70" font-weight="normal">300 answer tokens</text><text x="8" y="627" font-size="22" fill="#242728" font-weight="bold">(b) OPSD</text><text x="8" y="665" font-size="16" fill="#242728" font-weight="normal">… Track your workouts, measure body</text><text x="8" y="690" font-size="16" fill="#242728" font-weight="normal">metrics, take photos, and set SMART goals.</text><text x="8" y="731" font-size="16" fill="#242728" font-weight="normal">Use Wearable Technology: Devices like</text><text x="8" y="756" font-size="16" fill="#242728" font-weight="normal">smartwatches or fitness trackers can monitor</text><text x="8" y="781" font-size="16" fill="#242728" font-weight="normal">heart rate, steps, calories burned, and sleep</text><text x="8" y="806" font-size="16" fill="#242728" font-weight="normal">quality.</text><text x="8" y="847" font-size="16" fill="#666b70" font-weight="normal">… response continues until the generation</text><text x="8" y="872" font-size="16" fill="#242728" font-weight="normal">limit.</text><text x="8" y="917" font-size="13" fill="#666b70" font-weight="bold">Incorrect: violates preference</text><text x="8" y="940" font-size="12" fill="#666b70" font-weight="normal">300 answer tokens</text><text x="8" y="1003" font-size="22" fill="#2563b8" font-weight="bold">(c) MemFold</text><text x="8" y="1041" font-size="16" fill="#2563b8" font-weight="normal">Track your workouts with a fitness app or</text><text x="8" y="1066" font-size="16" fill="#2563b8" font-weight="normal">journal, and record your strength and</text><text x="8" y="1091" font-size="16" fill="#2563b8" font-weight="normal">endurance gains.</text><text x="8" y="1132" font-size="16" fill="#2563b8" font-weight="normal">Take regular body measurements and use a</text><text x="8" y="1157" font-size="16" fill="#2563b8" font-weight="normal">progress photo log to monitor changes in</text><text x="8" y="1182" font-size="16" fill="#2563b8" font-weight="normal">body composition.</text><text x="8" y="1223" font-size="16" fill="#242728" font-weight="normal">Set specific, measurable goals, stay</text><text x="8" y="1248" font-size="16" fill="#242728" font-weight="normal">consistent, and adjust your plan as needed.</text><text x="8" y="1293" font-size="13" fill="#2563b8" font-weight="bold">Correct: respects preference</text><text x="8" y="1316" font-size="12" fill="#666b70" font-weight="normal">96 answer tokens</text></svg>
